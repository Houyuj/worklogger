<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <title>Protocol - Work Logger</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f6f8; color: #1f2937; }
        .topbar { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 32px; background: white; border-bottom: 1px solid #dbe3ea; }
        .back { color: #475569; text-decoration: none; font-weight: 600; }
        .save { margin-left: auto; border: 0; border-radius: 6px; padding: 9px 16px; background: #0f766e; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        .save:disabled { background: #94a3b8; }
        .workspace { max-width: 1080px; margin: 28px auto; padding: 0 20px 48px; }
        .document { background: white; border: 1px solid #dbe3ea; box-shadow: 0 3px 12px rgba(15, 23, 42, .07); }
        .title { width: 100%; border: 0; border-bottom: 1px solid #e2e8f0; padding: 28px 34px 20px; color: #0f172a; font: 700 28px/1.25 inherit; outline: none; }
        .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 28px; border-bottom: 1px solid #e2e8f0; background: #fbfdff; position: sticky; top: 0; z-index: 2; }
        .toolbar select, .toolbar button { height: 34px; border: 1px solid #cbd5e1; border-radius: 5px; background: white; color: #334155; font: inherit; cursor: pointer; }
        .toolbar select { padding: 0 8px; }
        .toolbar button { min-width: 34px; padding: 0 9px; font-weight: 700; }
        .toolbar button:hover { background: #e0f2fe; border-color: #7dd3fc; }
        .divider { width: 1px; height: 24px; background: #cbd5e1; margin: 0 3px; }
        #editor { min-height: 620px; padding: 32px 34px 56px; outline: none; font-size: 16px; line-height: 1.75; }
        #editor:empty::before { content: "Write your Protocol, procedure, or research log..."; color: #94a3b8; }
        #editor h1 { font-size: 2em; margin: 1.1em 0 .45em; }
        #editor h2 { font-size: 1.55em; margin: 1em 0 .4em; }
        #editor h3 { font-size: 1.25em; margin: .9em 0 .35em; }
        #editor h4 { font-size: 1.05em; margin: .8em 0 .3em; }
        #editor p { margin: 0 0 .7em; }
        #editor img { display: block; max-width: 100%; max-height: 620px; margin: 16px 0; border: 1px solid #dbe3ea; }
        #editor table { width: 100%; border-collapse: collapse; margin: 18px 0; }
        #editor th, #editor td { min-width: 72px; padding: 8px 10px; border: 1px solid #94a3b8; vertical-align: top; }
        #editor th { background: #e2e8f0; font-weight: 700; }
        .notice { margin: 14px 0; color: #64748b; font-size: 14px; }
        .toast { position: fixed; right: 24px; top: 78px; padding: 10px 14px; background: #166534; color: white; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
        @media (max-width: 640px) { .topbar { padding: 0 16px; } .workspace { padding: 0; margin-top: 0; } .document { border-left: 0; border-right: 0; } .title { padding: 22px 18px 16px; font-size: 24px; } .toolbar { padding: 8px 14px; } #editor { padding: 24px 18px 48px; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="back" href="experiments.html">Back to Protocols</a>
        <span id="saveState" class="notice"></span>
        <button id="saveButton" class="save" type="button" onclick="saveProtocol()">Save</button>
    </header>
    <main class="workspace">
        <div class="document">
            <input id="protocolTitle" class="title" aria-label="Protocol title" placeholder="Protocol title">
            <div class="toolbar" aria-label="Document formatting">
                <select id="blockFormat" onchange="applyBlockFormat(this.value)" title="Text level">
                    <option value="P">Body</option>
                    <option value="H1">Heading 1</option>
                    <option value="H2">Heading 2</option>
                    <option value="H3">Heading 3</option>
                    <option value="H4">Heading 4</option>
                </select>
                <span class="divider"></span>
                <button type="button" onclick="format('bold')" title="Bold">B</button>
                <button type="button" onclick="format('italic')" title="Italic"><i>I</i></button>
                <button type="button" onclick="format('underline')" title="Underline"><u>U</u></button>
                <button type="button" onclick="format('insertUnorderedList')" title="Bulleted list">List</button>
                <button type="button" onclick="format('insertOrderedList')" title="Numbered list">1.</button>
                <span class="divider"></span>
                <button type="button" onclick="document.getElementById('imageInput').click()" title="Insert image">Image</button>
                <input id="imageInput" type="file" accept="image/*" hidden onchange="insertImage(event)">
            </div>
            <div id="editor" contenteditable="true" role="textbox" aria-multiline="true"></div>
        </div>
    </main>
    <script src="api.js"></script>
    <script>
        let experimentId = null;
        let dirty = false;
        let savedRange = null;

        document.addEventListener('DOMContentLoaded', initializePage);

        async function initializePage() {
            experimentId = new URLSearchParams(window.location.search).get('id');
            if (!experimentId) {
                window.location.href = 'experiments.html';
                return;
            }
            try {
                const experiment = await api.getExperiment(experimentId);
                document.getElementById('protocolTitle').value = experiment.name || '';
                document.getElementById('editor').innerHTML = experiment.content || legacyContent(experiment);
                document.getElementById('editor').addEventListener('input', markDirty);
                document.getElementById('editor').addEventListener('mouseup', captureSelection);
                document.getElementById('editor').addEventListener('keyup', captureSelection);
                document.querySelector('.toolbar').addEventListener('mousedown', captureSelection);
                document.getElementById('protocolTitle').addEventListener('input', markDirty);
                document.addEventListener('keydown', event => {
                    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
                        event.preventDefault();
                        saveProtocol();
                    }
                });
            } catch (error) {
                alert('Could not load protocol: ' + (error.message || 'Unknown error'));
                window.location.href = 'experiments.html';
            }
        }

        function legacyContent(experiment) {
            const sections = [
                ['Hypothesis', experiment.hypothesis], ['Methodology', experiment.methodology],
                ['Results', experiment.results], ['Conclusion', experiment.conclusion], ['Notes', experiment.progress_notes]
            ].filter(([, value]) => value);
            return sections.map(([title, value]) => `<h2>${escapeHtml(title)}</h2><p>${escapeHtml(String(value))}</p>`).join('');
        }

        function markDirty() {
            dirty = true;
            document.getElementById('saveState').textContent = 'Unsaved changes';
        }

        function captureSelection() {
            const selection = window.getSelection();
            const editor = document.getElementById('editor');
            if (selection.rangeCount && editor.contains(selection.anchorNode)) savedRange = selection.getRangeAt(0).cloneRange();
        }

        function restoreSelection() {
            const editor = document.getElementById('editor');
            editor.focus();
            if (!savedRange) return;
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(savedRange);
        }

        function format(command) { restoreSelection(); document.execCommand(command, false, null); captureSelection(); markDirty(); }
        function applyBlockFormat(tag) { restoreSelection(); document.execCommand('formatBlock', false, tag); captureSelection(); markDirty(); }

        function insertImage(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file || !file.type.startsWith('image/')) return;
            if (file.size > 5 * 1024 * 1024) { alert('Choose an image smaller than 5 MB.'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                restoreSelection();
                document.execCommand('insertImage', false, reader.result);
                captureSelection();
                markDirty();
            };
            reader.readAsDataURL(file);
        }

        async function saveProtocol() {
            const name = document.getElementById('protocolTitle').value.trim();
            if (!name) { alert('Enter a protocol title.'); return; }
            const button = document.getElementById('saveButton');
            button.disabled = true;
            try {
                await api.updateExperiment(Number(experimentId), { name, content: document.getElementById('editor').innerHTML });
                dirty = false;
                document.getElementById('saveState').textContent = 'Saved';
                setTimeout(() => { if (!dirty) document.getElementById('saveState').textContent = ''; }, 1600);
            } catch (error) {
                alert('Could not save protocol: ' + (error.message || 'Unknown error'));
            } finally { button.disabled = false; }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>

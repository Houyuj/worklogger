  <g transform="translate(920 52)" filter="url(#shadow)">
    <rect x="0" y="18" width="218" height="230" rx="24" fill="#ffffff" stroke="#cfdedb" stroke-width="2"/>
    <rect x="25" y="0" width="168" height="55" rx="16" fill="#5b827a"/>
    <circle cx="63" cy="27" r="7" fill="#f6ce7e"/>
    <circle cx="89" cy="27" r="7" fill="#95d9c5"/>

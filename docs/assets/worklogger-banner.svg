<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">WorkLogger scientific research workbench</title>
  <desc id="description">A soft green scientific cartoon banner with a laboratory flask, research notes, timeline cards, and the WorkLogger title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f3"/>
      <stop offset="0.55" stop-color="#f8faf8"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcc6"/>
      <stop offset="1" stop-color="#4fae95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#345b55" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="324" rx="34" fill="url(#background)" stroke="#d4e4df" stroke-width="2"/>

  <g opacity="0.48" fill="#9bc8bc">

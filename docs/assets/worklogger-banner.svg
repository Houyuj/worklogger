    <circle cx="1160" cy="271" r="3"/>
    <circle cx="311" cy="48" r="3"/>
    <circle cx="843" cy="293" r="4"/>
  </g>

  <g transform="translate(54 48)" filter="url(#shadow)">
    <rect x="0" y="0" width="196" height="244" rx="26" fill="#ffffff" stroke="#cfe0dc" stroke-width="2"/>
    <path d="M77 37h42M88 37v47l-42 82c-13 27 5 47 32 47h42c28 0 45-21 32-47l-43-82V37" fill="none" stroke="#355c57" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M59 160c18-12 35 10 57-2 12-6 23-5 33 1l8 20c7 18-6 32-25 32H67c-19 0-31-14-23-32z" fill="url(#liquid)" opacity="0.96"/>
    <g fill="#d9f2ea" stroke="#4fae95" stroke-width="2">

    <text x="3" y="99" fill="#587078" font-family="Segoe UI, Arial, sans-serif" font-size="23">A local research workbench for plans, tasks &amp; Protocols</text>

    <g transform="translate(0 139)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">
      <rect x="0" y="0" width="164" height="42" rx="21" fill="#dff2eb" stroke="#b8dacf"/>
      <text x="24" y="27" fill="#356b5e">🔒 Local data</text>
      <rect x="177" y="0" width="196" height="42" rx="21" fill="#e8eef8" stroke="#c8d5e7"/>
      <text x="199" y="27" fill="#486482">🧪 Protocol-first</text>
      <rect x="386" y="0" width="193" height="42" rx="21" fill="#fff2d9" stroke="#ecd7a8"/>
      <text x="408" y="27" fill="#796033">📊 Report-ready</text>
    </g>

    <g transform="translate(3 215)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h520" stroke="#c8d9d5" stroke-width="4"/>
      <circle cx="0" cy="0" r="9" fill="#4fae95" stroke="#ffffff" stroke-width="3"/>
      <circle cx="173" cy="0" r="9" fill="#7da3c8" stroke="#ffffff" stroke-width="3"/>
